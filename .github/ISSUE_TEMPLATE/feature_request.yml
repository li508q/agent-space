name: Suggest an improvement
description: Help make personal work and human–agent collaboration clearer.
body:
  - type: textarea
    id: situation
    attributes:
      label: What were you trying to do?
      description: Describe a real situation, the current friction and your intended outcome.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What would help?
      description: Explain how this improves writing, shared context, understandable changes or recovery.
    validations:
      required: true
